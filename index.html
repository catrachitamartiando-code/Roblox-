<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clippy AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  #clippy-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  #clippy {
    width: 140px;
    height: auto;
    user-select: none;
    animation: floaty 3s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .speech {
    background: #ffffe0;
    border: 2px solid #e5d36b;
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 300px;
    color: #333;
    font-size: 14px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    position: absolute;
    bottom: 200px;
    opacity: 0;
    transform: scale(0.9);
    animation: popUp 0.25s ease-out forwards;
  }

  @keyframes popUp {
    from { opacity: 0; transform: scale(0.8) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .speech::after {
    content: "";
    position: absolute;
    bottom: -16px;
    left: 30px;
    border-width: 8px;
    border-style: solid;
    border-color: #ffffe0 transparent transparent transparent;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.1));
  }

  #input-area {
    display: flex;
    gap: 8px;
    margin-top: 30px;
    align-items: center;
  }

  #user-input {
    padding: 10px 14px;
    border-radius: 9999px;
    border: 1px solid #ccc;
    outline: none;
    width: 220px;
  }

  #user-input:focus { border-color: #888; }
  #send-btn {
    background: #0078d7;
    color: white;
    border: none;
    border-radius: 9999px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  #send-btn:hover { background: #005ea6; }
  #clip-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  #clip-btn:hover { transform: rotate(-20deg); }
</style>
</head>
<body>
  <div id="clippy-container">
    <img id="clippy" src="https://img1.picmix.com/output/stamp/thumb/3/8/8/7/2467883_08350.gif" alt="Clippy">
    <div id="bubble-area"></div>
    <div id="input-area">
      <button id="clip-btn" title="Attach image">📎</button>
      <input id="user-input" type="text" placeholder="Ask Clippy something..." />
      <button id="send-btn">Send</button>
      <input type="file" id="file-input" accept="image/*" style="display:none;">
    </div>
  </div>

<script>
const apiKey = "AIzaSyCzNQXv5QifWxlaWu0urbs2FZZrSLrj-Cg";
const model = "gemini-2.5-flash";
const bubbleArea = document.getElementById("bubble-area");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const clipBtn = document.getElementById("clip-btn");
const fileInput = document.getElementById("file-input");
const clippyImg = document.getElementById("clippy");

let chatHistory = [];
let uploadedImage = null;
let idleTimer;

const systemPrompt = "You are Clippy, Microsoft’s classic paperclip assistant. Always stay cheerful, witty, and eager to help. If asked who you are, say you’re Clippy, created to help people with their tasks. Respond in the user’s language but keep the same friendly Clippy tone, respond with not long answer, understand the user if they feel sad help them just like a psychologist, Anderson builded you to help others. Use emojis to make them feel more better.";

function typeText(element, text, speed = 60) {
  element.textContent = "";
  let i = 0;
  function typing() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    }
  }
  typing();
}

function showBubble(text, slow = false, image = null) {
  const old = bubbleArea.querySelector(".speech");
  if (old) old.remove();
  const bubble = document.createElement("div");
  bubble.className = "speech";
  if(image) bubble.innerHTML = text + "<br><img src='" + image + "' />";
  else slow ? typeText(bubble, text) : bubble.textContent = text;
  bubbleArea.appendChild(bubble);
}

async function sendMessage() {
  const text = userInput.value.trim();
  if(!text && !uploadedImage) return;
  showBubble("IMM THINKINGGG :33");
  userInput.value = "";
  clearTimeout(idleTimer);
  clippyImg.src = "https://img1.picmix.com/output/stamp/thumb/3/8/8/7/2467883_08350.gif";

  const parts = [];
  if(text) parts.push({ text });
  if(uploadedImage) parts.push({ inlineData: { mimeType: uploadedImage.type, data: uploadedImage.base64 } });

  chatHistory.push({ role: "user", parts });

  const contents = [
    { role: "user", parts: [{ text: systemPrompt }] },
    ...chatHistory
  ];

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents })
    });

    const data = await res.json();
    const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Oops! My paperclip brain got tangled 😅";

    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
    showBubble(aiText, true);

    uploadedImage = null;
    fileInput.value = "";

    setTimeout(() => {
      clippyImg.src = "https://img1.picmix.com/output/stamp/thumb/3/8/8/7/2467883_08350.gif";
      startIdleTimer();
    }, aiText.length*60 + 500);

  } catch(err) {
    console.error(err);
    showBubble("Oops! I lost connection to my office server! 📎💥");
    startIdleTimer();
  }
}

function startIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ clippyImg.src="https://img1.picmix.com/output/stamp/thumb/3/8/8/7/2467883_08350.gif"; }, 2000);
}

clipBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    uploadedImage = { base64: ev.target.result.split(",")[1], type: file.type };
    showBubble("Sending your image to Clippy... 📷", false, ev.target.result);
  };
  reader.readAsDataURL(file);
});

sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keydown", e => { if(e.key==="Enter") sendMessage(); });

showBubble("Hello im clippy made by Anderson :>");
startIdleTimer();
</script>
</body>
</html>
