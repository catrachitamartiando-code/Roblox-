<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>roblox's PS5 Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #0a0e17;
      color: white;
      overflow: hidden;
      height: 100vh;
      box-sizing: border-box;
    }

    /* ====================== LOADING SCREEN ====================== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 1.2s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .ps-logo {
      width: 180px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .loading-text {
      margin-top: 40px;
      font-size: 1.6em;
      letter-spacing: 4px;
    }

    .loading-bar {
      width: 300px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-top: 30px;
      overflow: hidden;
    }

    .loading-fill {
      width: 0%;
      height: 100%;
      background: #007aff;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ====================== NAME INPUT SCREEN ====================== */
    #name-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #001133, #000);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 90;
    }

    #name-screen.active {
      display: flex;
    }

    .name-box {
      background: rgba(255,255,255,0.08);
      padding: 50px 80px;
      border-radius: 30px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,122,255,0.4);
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .name-box h1 {
      font-size: 3em;
      margin-bottom: 30px;
      color: #007aff;
    }

    #name-input {
      padding: 18px 30px;
      width: 300px;
      font-size: 1.4em;
      background: rgba(255,255,255,0.1);
      border: 2px solid #007aff;
      border-radius: 15px;
      color: white;
      text-align: center;
    }

    #name-input:focus {
      outline: none;
      border-color: #00aaff;
      box-shadow: 0 0 20px rgba(0,170,255,0.6);
    }

    #name-btn {
      margin-top: 30px;
      padding: 18px 50px;
      background: #007aff;
      border: none;
      border-radius: 50px;
      font-size: 1.4em;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0,122,255,0.6);
    }

    #name-btn:hover {
      background: #005ecb;
      transform: scale(1.05);
    }

    /* ====================== MAIN DASHBOARD (same as before) ====================== */
    .background {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      z-index: -1;
      filter: blur(40px) brightness(0.4);
      transition: background-image 0.8s ease;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .container.visible {
      opacity: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
      background: rgba(10, 14, 23, 0.8);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .header h1 {
      font-size: 1.8em;
      margin: 0;
    }

    .carousel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .cards {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
      gap: 40px;
    }

    .card {
      width: 280px;
      height: 380px;
      background-size: cover;
      background-position: center;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      filter: brightness(0.75);
      position: relative;
    }

    .card.active {
      transform: scale(1.2);
      filter: brightness(1);
      z-index: 5;
      box-shadow: 0 30px 60px rgba(0, 122, 255, 0.5);
      outline: 5px solid #007aff;
    }

    .card:not(.active) {
      opacity: 0.6;
      transform: scale(0.9);
    }

    .card-title {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 1.4em;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 0 0 24px 24px;
    }

    .details {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 400px;
      padding: 30px;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 6;
    }

    .launch-btn {
      margin-top: 30px;
      padding: 18px 40px;
      background: #007aff;
      border: none;
      border-radius: 50px;
      color: white;
      font-size: 1.4em;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 122, 255, 0.6);
      text-transform: uppercase;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: rgba(10, 14, 23, 0.8);
      backdrop-filter: blur(10px);
    }

    .category {
      padding: 15px 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 50px;
      font-size: 1.2em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .category.active, .category:hover {
      background: #007aff;
      box-shadow: 0 0 20px rgba(0, 122, 255, 0.5);
    }

    #app-window {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 50;
    }

    #app-header {
      height: 60px;
      background: rgba(0,122,255,0.95);
      display: flex;
      align-items: center;
      padding: 0 30px;
      justify-content: space-between;
      font-size: 1.8em;
    }

    #close-app {
      font-size: 34px;
      cursor: pointer;
    }

    #app-iframe {
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>

  <!-- PS5 Style Loading Screen -->
  <div id="loading-screen">
    <svg class="ps-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#007aff" stroke-width="8"/>
      <path d="M30 50 Q50 20, 70 50" fill="none" stroke="#007aff" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <div class="loading-text">PLAYSTATION</div>
    <div class="loading-bar">
      <div class="loading-fill" id="loading-fill"></div>
    </div>
  </div>

  <!-- Name Input Screen -->
  <div id="name-screen">
    <div class="name-box">
      <h1>Welcome</h1>
      <input type="text" id="name-input" placeholder="Enter your name" maxlength="20">
      <button id="name-btn">Continue</button>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div class="background" id="background"></div>

  <div class="container" id="main-container">
    <div class="header">
      <h1 id="user-greeting">roblox's Dashboard</h1>
    </div>

    <div class="carousel">
      <div class="cards" id="cards">
        <div class="card active"
             style="background-image: url('https://wallpapers.com/images/featured/ubuntu-z6rtxbp6rijb53hx.jpg');"
             data-title="LINUX"
             data-desc="Run Wine GUI on Ubuntu - Linux environment in browser."
             data-bg="https://wallpapers.com/images/featured/ubuntu-z6rtxbp6rijb53hx.jpg"
             data-url="https://www.winfy.net/runwine/index.php?os=winegui_2_ubuntu-22-amd64">
          <div class="card-title">LINUX</div>
        </div>

        <div class="card"
             style="background-image: url('https://images.stockcake.com/public/1/b/4/1b411215-b8c4-4859-aa96-757915fb8f99_large/human-ai-interface-stockcake.jpg');"
             data-title="Digital"
             data-desc="Advanced digital AI chat and tools."
             data-bg="https://thumbs.dreamstime.com/b/metaverse-fantasy-concept-person-visits-futuristic-cyber-city-generative-ai-virtual-fantastic-world-theme-portal-vr-268666913.jpg"
             data-url="https://digitalprotgtemplate-38441.chipp.ai/w/chat/">
          <div class="card-title">Digital</div>
        </div>

        <div class="card"
             style="background-image: url('https://www.blackdown.org/wp-content/uploads/2023/01/How-a-Proxy-Server-Works.jpg.webp');"
             data-title="PROXY"
             data-desc="Secure proxy browsing and tools."
             data-bg="https://www.blackdown.org/wp-content/uploads/2023/01/How-a-Proxy-Server-Works.jpg.webp"
             data-url="https://sciences.drsanjay.com.au/">
          <div class="card-title">PROXY</div>
        </div>

        <div class="card"
             style="background-image: url('https://image.api.playstation.com/vulcan/ap/rnd/202008/1020/Kq7iou5mZ9y6HlbF7QGCGS2P.jpg');"
             data-title="Astro's Playroom"
             data-desc="Explore PlayStation history with fun platforming."
             data-bg="https://wallpapers.com/images/hd/ps5-welcome-screen-message-4s77cjgcnxnqt7ke.jpg">
          <div class="card-title">Astro's Playroom</div>
        </div>

        <div class="card"
             style="background-image: url('https://image.api.playstation.com/vulcan/ap/rnd/202008/1300/5JzcA5RKo3i3p1t2Q0qXzQ.png');"
             data-title="Spider-Man: Miles Morales"
             data-desc="Swing through New York as Miles."
             data-bg="https://wallpapercave.com/wp/wp6623882.jpg">
          <div class="card-title">Spider-Man</div>
        </div>
      </div>
    </div>

    <div class="details" id="details">
      <h1>LINUX</h1>
      <p>Run Wine GUI on Ubuntu - Linux environment in browser.</p>
      <button class="launch-btn" id="launch-btn">Launch</button>
    </div>
  </div>

  <div class="categories">
    <div class="category active">Home</div>
    <div class="category">Apps</div>
    <div class="category">Media</div>
    <div class="category">Store</div>
  </div>

  <div id="app-window">
    <div id="app-header">
      <span id="app-title">App</span>
      <span id="close-app">×</span>
    </div>
    <iframe id="app-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
  </div>

  <script>
    // Loading simulation
    const loadingFill = document.getElementById('loading-fill');
    const loadingScreen = document.getElementById('loading-screen');
    const nameScreen = document.getElementById('name-screen');
    const mainContainer = document.getElementById('main-container');
    const userGreeting = document.getElementById('user-greeting');

    let progress = 0;
    const loadingInterval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress >= 100) {
        progress = 100;
        clearInterval(loadingInterval);
        loadingFill.style.width = '100%';
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
          setTimeout(() => {
            nameScreen.classList.add('active');
          }, 500);
        }, 800);
      }
      loadingFill.style.width = progress + '%';
    }, 300);

    // Name input
    const nameInput = document.getElementById('name-input');
    const nameBtn = document.getElementById('name-btn');

    nameBtn.addEventListener('click', saveName);
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveName();
    });

    function saveName() {
      let name = nameInput.value.trim();
      if (name === '') name = 'roblox';
      userGreeting.textContent = `${name}'s Dashboard`;
      nameScreen.style.opacity = '0';
      setTimeout(() => {
        nameScreen.style.display = 'none';
        mainContainer.classList.add('visible');
      }, 800);
    }

    // Dashboard script (same as before)
    const cards = document.querySelectorAll(".card");
    const cardsContainer = document.getElementById("cards");
    const details = document.getElementById("details");
    const bg = document.getElementById("background");
    const launchBtn = document.getElementById("launch-btn");
    const appWindow = document.getElementById("app-window");
    const appIframe = document.getElementById("app-iframe");
    const appTitle = document.getElementById("app-title");
    const closeApp = document.getElementById("close-app");

    let activeIndex = 0;

    function updateActive(index) {
      activeIndex = (index + cards.length) % cards.length;
      cards.forEach((c, i) => c.classList.toggle("active", i === activeIndex));
      const activeCard = cards[activeIndex];
      details.querySelector("h1").textContent = activeCard.dataset.title;
      details.querySelector("p").textContent = activeCard.dataset.desc;
      bg.style.backgroundImage = `url(${activeCard.dataset.bg})`;
      const cardWidth = cards[0].offsetWidth + 40;
      const offset = -activeIndex * cardWidth + (window.innerWidth / 2 - cardWidth / 2);
      cardsContainer.style.transform = `translateX(${offset}px)`;
    }

    launchBtn.addEventListener("click", () => {
      const activeCard = cards[activeIndex];
      if (activeCard.dataset.url) {
        appIframe.src = activeCard.dataset.url;
        appTitle.textContent = activeCard.dataset.title;
        appWindow.style.display = "flex";
      }
    });

    closeApp.addEventListener("click", () => {
      appWindow.style.display = "none";
      appIframe.src = "";
    });

    cards.forEach((card, i) => card.addEventListener("click", () => updateActive(i)));

    document.addEventListener("keydown", (e) => {
      if (appWindow.style.display === "flex") return;
      if (e.key === "ArrowRight") updateActive(activeIndex + 1);
      if (e.key === "ArrowLeft") updateActive(activeIndex - 1);
      if (e.key === "Enter") launchBtn.click();
    });

    let touchStartX = 0;
    document.querySelector('.carousel').addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
    document.querySelector('.carousel').addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) updateActive(activeIndex + (diff > 0 ? 1 : -1));
    });

    updateActive(0);
  </script>
</body>
</html>
